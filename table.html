<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Accessible Table</title>
  <style>

      table, th, td {
        border-collapse: collapse;
      }
      td {
        border-collapse: collapse;
        border: 2px solid red;
      }
      td {
        padding-right: 50px;
      }


  </style>
</head>
<body>
<header><h1>Accessible Table</h1></header>
<section>
  <h2>accessible table content</h2>
<table>
  <caption>Types of Airplane Engines</caption>
 <thead>
  <tr>
    <th scope="col">Propeller</th>
    <th scope="col">Turbofan</th>
    <th scope="col">Jet</th>
  </tr>
</thead>
<tbody>
  <tr>
    <td>Cessna 172</td>
    <td>Boeing 777</td>
    <td>Bombardier Global 8000</td>
  </tr>
  <tr>
    <td>Pilatus PC-12</td>
    <td>Airbus A320</td>
    <td>F-22 Raptor</td>
  </tr>
 </tbody>

</table>

</section>


</body>
</html>
